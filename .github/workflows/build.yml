name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Configuration
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Paquet
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/impact_duel.exe build/Release/impact_server.exe dist/
          else
            cp build/impact_duel build/impact_server dist/
          fi
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: impact-duel-${{ matrix.name }}
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Archives
        run: |
          cd artifacts
          for d in */; do zip -r "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
